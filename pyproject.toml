[project]
name = "api-gateway-infrastructure"
version = "0.2.0"
description = "Pulumi program for the VilnaCRM API gateway"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pulumi>=3.200.0,<4",
    "pulumi-aws==7.23.0",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "pytest>=8.0,<10",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["pulumi", "tests"]

[tool.coverage.run]
branch = true
source = ["pulumi"]

[tool.coverage.report]
show_missing = true
