version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        USERNAME: "dev"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - AWS_PROFILE
      - AWS_REGION
    tty: true
    stdin_open: true
