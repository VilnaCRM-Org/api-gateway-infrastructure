version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        USERNAME: "${USER:-appuser}"
    volumes:
      - ./pulumi:/home/${USER}/project
      - type: bind
        source: "${HOME}/.aws"
        target: "/home/${USER}/.aws"
        read_only: true
    working_dir: /home/${USER}/project
    environment:
      - USER
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - AWS_PROFILE
      - AWS_SDK_LOAD_CONFIG
      - PULUMI_STACK
      - PULUMI_BACKEND_URL
      - PULUMI_CONFIG_PASSPHRASE_FILE
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
