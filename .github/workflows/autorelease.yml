name: Tag and Release

# PD-11: tag and release only. No commit to main, no App token, no secret
# other than the job's short-lived GITHUB_TOKEN. CHANGELOG.md is no longer
# written by this workflow; release notes are generated on the GitHub release.
on:
  push:
    branches:
      - main

concurrency:
  group: autorelease
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the tag and the GitHub release (PD-11)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version from conventional commits
        id: version
        run: python3 scripts/next_release_version.py

      - name: Create tag and GitHub release
        if: steps.version.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
