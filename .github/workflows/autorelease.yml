name: Tag and Release

# PD-11: tag and release only. No commit to main, no App token, no secret
# other than the job's short-lived GITHUB_TOKEN. CHANGELOG.md is no longer
# written by this workflow; release notes are generated on the GitHub release.
on:
  push:
    branches:
      - main

concurrency:
  group: autorelease
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version from conventional commits
        id: version
        run: |
          set -euo pipefail
          last="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -n "$last" ]; then
            range="${last}..HEAD"
          else
            last="v0.0.0"
            range="HEAD"
          fi
          subjects="$(git log --format=%s "$range")"
          bodies="$(git log --format=%b "$range")"
          major=0; minor=0; patch=0
          IFS=. read -r major minor patch <<< "${last#v}"
          bump='none'
          if printf '%s\n' "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:' \
            || printf '%s\n' "$bodies" | grep -Eq '^BREAKING[ -]CHANGE:'; then
            bump='major'
          elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
            bump='minor'
          elif printf '%s\n' "$subjects" | grep -Eq '^fix(\([^)]*\))?:'; then
            bump='patch'
          fi
          # Below 1.0.0 a breaking change bumps the minor version.
          if [ "$bump" = major ] && [ "$major" -eq 0 ]; then bump='minor'; fi
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            none)
              echo "No releasable commits since ${last}; skipping."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          tag="v${major}.${minor}.${patch}"
          {
            echo "skipped=false"
            echo "tag=${tag}"
            echo "previous=${last}"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.version.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ "$PREVIOUS" != "v0.0.0" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$TAG" "${args[@]}" --repo "$GITHUB_REPOSITORY"
