name: Security Scans

# G3.2 PR quality battery (AD-A11, FR-A08, FR-A10). Every job runs on every
# pull request, forks included, with contents: read only and no secret. Each
# job name is a required check of the main ruleset (G2.2).
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  secrets_scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the development image
        run: make build

      - name: Secrets Scan
        run: make test-secrets

  dependency_audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the development image
        run: make build

      - name: Dependency Audit
        run: make test-deps-security

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the development image
        run: make build

      - name: Bandit
        run: make test-bandit

  dependency_review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Compares the PR's dependency graph through the API; needs no checkout.
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the development image
        run: make build

      - name: Actionlint
        run: make test-actionlint

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the development image
        run: make build

      # The job's read-only token (contents: read; a fork PR gets a read-only
      # token too), scoped to this step, enables zizmor's online audits:
      # impostor-commit, ref-confusion, known-vulnerable-actions.
      - name: Zizmor
        run: make test-zizmor-online
        env:
          GH_TOKEN: ${{ github.token }}

  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the development image
        run: make build

      - name: Yamllint
        run: make test-yaml

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the development image
        run: make build

      - name: Hadolint
        run: make test-dockerfile
