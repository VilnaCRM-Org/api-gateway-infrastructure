name: CodeQL

# G3.2 PR quality battery (AD-A11, FR-A10, NFR-A11). The jobs run with
# contents: read only, so analyze does not upload to code scanning (that needs
# security-events: write). It writes SARIF instead, and the gate fails the job
# on any result: CodeQL stays blocking without a write permission.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false

      - name: Fail on any CodeQL result
        run: python3 scripts/codeql_sarif_gate.py "$RUNNER_TEMP/codeql-results"
